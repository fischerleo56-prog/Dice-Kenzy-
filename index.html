<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenzy Dice — Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-blue: #3399ff;
        --dark-blue: #0066cc;
        --white: #ffffff;
        --shadow-dark: rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        background: linear-gradient(180deg, #3e6d9d 0%, #1a3a5a 100%);
        font-family: 'Luckiest Guy', cursive;
        position: relative;
    }

    /* Same background layers used by Kenzy Dice */
    .bg-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 150%;
        background: url('https://kenzydice.pages.dev/pic/background.png') repeat;
        background-size: 35% auto;
        opacity: .85;
        z-index: 0;
        pointer-events: none;
    }

    .bg-overlay-2 {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 150%;
        background: url('https://kenzydice.pages.dev/pic/light.png') no-repeat;
        background-size: 125% auto;
        opacity: .75;
        z-index: 1;
        pointer-events: none;
    }

    .logo {
        position: fixed;
        top: 18px;
        left: 20px;
        width: min(250px, 34vw);
        height: auto;
        z-index: 10;
        filter: drop-shadow(5px 6px 5px rgba(0,0,0,.45));
    }

    .offline {
        position: relative;
        z-index: 5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 100px 25px 40px;
        text-align: center;
    }

    .message {
        max-width: 1050px;
        color: var(--white);
        font-size: clamp(34px, 5vw, 72px);
        line-height: 1.12;
        text-shadow:
            6px 6px 0 var(--dark-blue),
            8px 8px 10px var(--shadow-dark);
        -webkit-text-stroke: 1px var(--dark-blue);
        animation: appear .6s ease-out;
    }

    @keyframes appear {
        from { opacity: 0; transform: translateY(18px) scale(.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 600px) {
        .logo {
            top: 12px;
            left: 12px;
            width: 190px;
        }
        .offline {
            padding: 110px 18px 30px;
        }
        .message {
            font-size: clamp(30px, 8vw, 48px);
        }
    }
</style>
</head>
