<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kenzy Verify</title></head>
<body style="font-family:Arial;background:#111;color:white;padding:30px">
<h1>🔒 Kenzy Roll Verify</h1>
<textarea id="code" style="width:400px;height:80px" placeholder="KZ-XXXXXX"></textarea><br>
<button onclick="verify()">Verify</button>
<pre id="out"></pre>
<script>
function verify(){
 const code=document.getElementById("code").value.trim();
 const id=code.replace("KZ-","");
 const data=localStorage.getItem("KZ_"+id);
 if(!data){
  document.getElementById("out").textContent="❌ Invalid code";
  return;
 }
 const obj=JSON.parse(data);
 const names={red:"🟥 Red",orange:"🟧 Orange",gold:"🟨 Yellow",yellow:"🟨 Yellow",green:"🟩 Green",blue:"🟦 Blue",purple:"🟪 Purple"};
 let out="✅ CODE VALID\n\n🎲 Colors:\n";
 obj.colors.forEach((c,i)=>out+=(i+1)+". "+(names[c]||c)+"\n");
 document.getElementById("out").textContent=out;
}
</script>
</body>
</html>
