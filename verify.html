<!doctype html>
<html>
<head><meta charset="utf-8"><title>Verify Dice</title></head>
<body style="font-family:Arial;background:#111;color:white;padding:30px">
<h1>🔒 Verify Roll</h1>
<textarea id="code" style="width:400px;height:100px" placeholder="PF1.Code"></textarea><br>
<button onclick="verify()">Verify</button>
<pre id="out"></pre>
<script>
async function sha256(text){
 const d=new TextEncoder().encode(text);
 const h=await crypto.subtle.digest("SHA-256",d);
 return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function verify(){
 try{
  const d=JSON.parse(atob(document.getElementById('code').value.replace('PF1.','')));
  const h=await sha256(d.serverSeed+":"+d.clientSeed+":"+d.nonce);
  document.getElementById('out').textContent =
   h===d.hash ? "✅ VALID\nHash matches\nNonce: "+d.nonce :
   "❌ INVALID";
 }catch(e){document.getElementById('out').textContent="❌ Invalid code";}
}
</script>
</body>
</html>
