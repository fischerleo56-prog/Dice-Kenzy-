<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kenzy Verify</title></head>
<body style="font-family:Arial;background:#111;color:white;padding:30px">
<h1>🔒 Kenzy Roll Verify</h1>
<textarea id="code" style="width:400px;height:80px" placeholder="KZ-XXXXXX"></textarea><br>
<button onclick="verify()">Verify</button>
<pre id="out"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUT0t1I9Dkee5Ok_uYMzs4WfdwapOA5As",
  authDomain: "kenzy-dice.firebaseapp.com",
  projectId: "kenzy-dice",
  databaseURL: "https://kenzy-dice-default-rtdb.europe-west1.firebasedatabase.app",
  storageBucket: "kenzy-dice.firebasestorage.app",
  messagingSenderId: "578956722062",
  appId: "1:578956722062:web:5156f5737e51ef75246edf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.verify = async function(){
 const code=document.getElementById("code").value.trim();
 const id=code.replace("KZ-","");
 const snap = await get(ref(db, "verifyCodes/" + id));

 if(!snap.exists()){
   document.getElementById("out").textContent="❌ Invalid code";
   return;
 }

 const obj=snap.val();
 const names={
  red:"🟥 Red",
  orange:"🟧 Orange",
  gold:"🟨 Yellow",
  yellow:"🟨 Yellow",
  green:"🟩 Green",
  blue:"🟦 Blue",
  purple:"🟪 Purple"
 };

 let out="✅ CODE VALID\n\n🎲 Colors:\n";
 (obj.colors || []).forEach((c,i)=>{
   out += (i+1)+". "+(names[c]||c)+"\n";
 });

 document.getElementById("out").textContent=out;
}
</script>
</body>
</html>
